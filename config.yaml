mute:
  - model-vibes threads
  - funding rounds under $20M with no strategic angle
  - rehashed op-eds
  - benchmark claims with no independent verification

# Two-tier split, out of 20 (materiality + proximity + novelty + source_quality).
# Raise need_to_know_threshold if the top section feels padded; lower it if you
# keep finding real news buried in Other news.
need_to_know_threshold: 16   # full treatment: what changes a number, a plan, or a decision
other_news_threshold: 12     # one line and a link: worth having heard of
min_need_to_know: 3          # fewer than this and the day is called quiet
max_need_to_know: 6
