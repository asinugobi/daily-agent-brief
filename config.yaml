# Edit this file whenever priorities change. The agent reads it at the start of every run.
# Nothing else needs to change.

run_mode: daily            # daily | weekly | monthly | earnings-week
read_budget_words: 1200    # roughly a 10 minute read (1200 words)
depth_dial: 5              # 1 = headlines only, 5 = analyst memo

lookback_hours: 24
monday_lookback_hours: 72

