# --- Company disclosure - SEC EDGAR ---
edgar:
  - id: edgar_xbrl_frames_api
    name: "EDGAR XBRL Frames API"
    url: "https://data.sec.gov/api/xbrl/frames/us-gaap/PaymentsToAcquirePropertyPlantAndEquipment/USD/CY2025Q1.json"
    tier: 1
    access: open
    domain: econ
    cadence: "quarterly"
    note: "One concept across every filer for one period - the single most useful endpoint here. Verified: this call returns 2,701 filers' capex for CY2025Q1, ranking Alphabet 17.2B, Microsoft 16.8B, Meta 12.9B. Swap the concept for ResearchAndDevelopmentExpense or any us-gaap tag. Caution: filers use different tags for the same economics, so a frame is a starting population, not a complete one."
  - id: edgar_company_facts_api
    name: "EDGAR Company Facts API"
    url: "https://data.sec.gov/api/xbrl/companyfacts/CIK0001045810.json"
    tier: 1
    access: open
    domain: econ
    cadence: "continuous"
    note: "Every XBRL fact a filer has ever reported, in one document. Zero-pad the CIK to ten digits (this example is NVIDIA)."
  - id: edgar_company_concept_api
    name: "EDGAR Company Concept API"
    url: "https://data.sec.gov/api/xbrl/companyconcept/CIK0001045810/us-gaap/ResearchAndDevelopmentExpense.json"
    tier: 1
    access: open
    domain: econ
    cadence: "continuous"
    note: "One concept's full history for one filer, with the accession number behind each figure - so every number you publish is citable to a filing."
  - id: edgar_submissions_api
    name: "EDGAR Submissions API"
    url: "https://data.sec.gov/submissions/CIK0001045810.json"
    tier: 1
    access: open
    domain: econ
    cadence: "continuous"
    note: "Complete filing history and metadata for a filer. The entry point for tracking who filed what, when."
  - id: edgar_full_text_search
    name: "EDGAR Full-Text Search"
    url: "https://efts.sec.gov/LATEST/search-index?q=%22artificial+intelligence%22&forms=10-K"
    tier: 1
    access: open
    domain: econ
    cadence: "daily"
    note: "Searches filing text, not just metadata. The way to track how language like physical AI or agentic spreads through 10-K risk factors - a leading indicator disclosure picks up before revenue does."
  - id: edgar_current_filings_stream
    name: "EDGAR Current Filings Stream"
    url: "https://www.sec.gov/cgi-bin/browse-edgar?action=getcurrent&type=8-K&output=atom"
    tier: 1
    access: open
    domain: econ
    cadence: "continuous"
    note: "Real-time Atom feed of filings as they land. Change type= for 10-K, 10-Q, S-1. The fastest legitimate route to a material corporate event."
  - id: edgar_insider_transactions_form_4
    name: "EDGAR Insider Transactions - Form 4"
    url: "https://www.sec.gov/cgi-bin/browse-edgar?action=getcurrent&type=4&output=atom"
    tier: 1
    access: open
    domain: econ
    cadence: "continuous"
    note: "Officer and director trades, filed within two business days."
  - id: edgar_institutional_holdings_13f
    name: "EDGAR Institutional Holdings - 13F"
    url: "https://www.sec.gov/cgi-bin/browse-edgar?action=getcurrent&type=13F-HR&output=atom"
    tier: 1
    access: open
    domain: econ
    cadence: "quarterly"
    note: "Institutional positions. Filed 45 days after quarter-end - stale by construction, so never report it as a current holding."
  - id: sec_company_tickers_map
    name: "SEC Company Tickers Map"
    url: "https://www.sec.gov/files/company_tickers.json"
    tier: 1
    access: open
    domain: econ
    cadence: "weekly"
    note: "Ticker-to-CIK lookup. You need this before any other EDGAR call - fetch once and cache."
  - id: edgar_financial_statement_data_sets
    name: "EDGAR Financial Statement Data Sets"
    url: "https://www.sec.gov/files/dera/data/financial-statement-data-sets/2025q1.zip"
    tier: 1
    access: open
    domain: econ
    cadence: "quarterly"
    note: "Bulk quarterly ZIP of every filer's numeric XBRL data. Use this instead of thousands of API calls when doing cross-sectional work."
  - id: edgar_daily_index
    name: "EDGAR Daily Index"
    url: "https://www.sec.gov/Archives/edgar/daily-index/2026/QTR3/"
    tier: 1
    access: open
    domain: econ
    cadence: "daily"
    note: "Every filing accepted each day. The completeness backstop if a feed drops something."
  - id: sec_press_releases
    name: "SEC Press Releases"
    url: "https://www.sec.gov/news/pressreleases.rss"
    tier: 1
    access: open
    domain: econ
    cadence: "daily"
    note: "Enforcement actions and rulemaking. Pair with https://www.sec.gov/news/speeches-statements.rss for policy signals."

